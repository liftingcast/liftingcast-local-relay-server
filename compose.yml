services:
  liftingcast-database:
    image: liftingcast/database:latest
    restart: always
    hostname: liftingcast-database
    ports:
      - "5984:5984"
  liftingcast-web:
    image: liftingcast/web:latest
    restart: always
    hostname: liftingcast-web
    ports:
      - "80:80"
    depends_on:
      - liftingcast-database
